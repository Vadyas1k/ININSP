<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Notepad</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>📁 Заметки</h2>
                <button id="new-note-btn" class="btn btn-primary">+ Новая</button>
            </div>
            <ul id="notes-list" class="notes-list">
                <!-- Список заметок подгружается динамически -->
            </ul>
        </aside>
        <main class="editor-area">
            <header class="editor-header">
                <input type="text" id="note-title" placeholder="Название заметки..." class="title-input">
                <span id="status" class="status-text">Готово</span>
            </header>
            <textarea id="note-content" placeholder="Начните печатать..."></textarea>
            <div class="editor-controls">
                <span id="char-count">0 символов</span>
                <button id="delete-note-btn" class="btn btn-danger">🗑 Удалить</button>
            </div>
        </main>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
