name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-notepad
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black
      
      - name: Lint with Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      
      - name: Check formatting with Black
        run: black --check .

  security-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-notepad
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep
      
      - name: Run Bandit
        run: |
          bandit -r . -c .bandit -f custom --msg-template "{abspath}:{line}: {test_id}: {severity}: {msg}"
      
      - name: Run Semgrep
        run: semgrep scan --config p/python --metrics=off .
        env:
          SEMGREP_SEND_METRICS: off
        continue-on-error: true

  tests:
    runs-on: ubuntu-latest
    needs: lint-and-format
    defaults:
      run:
        working-directory: web-notepad
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      
      - name: Run tests
        run: pytest tests/ -v --tb=short

  sca-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-notepad
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies & SCA tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit
      
      - name: Generate SBOM
        run: python scripts/gen_sbom.py
      
      - name: Audit dependencies
        run: |
          pip-audit -r requirements.txt --format json > audit-report.json || true
          cat audit-report.json
      
      - name: Upload SCA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sca-results
          path: |
            web-notepad/sbom.json
            web-notepad/audit-report.json